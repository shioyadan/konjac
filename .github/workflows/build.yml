name: Build and Deploy Konjac

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: konjac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        # Native canvasはCLI専用であり、このworkflowが作るWeb版・拡張版では使わない。
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: make typecheck

      - name: Build distribution packages
        run: make package

      - name: Verify ZIP packages
        run: |
          unzip -tq dist/packages/konjac-web.zip
          unzip -tq dist/packages/konjac-extension.zip

      - name: Upload ZIP packages
        uses: actions/upload-artifact@v7
        with:
          name: konjac-packages
          path: dist/packages/*.zip
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download ZIP packages
        uses: actions/download-artifact@v8
        with:
          name: konjac-packages
          path: dist/packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/packages/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/packages/*.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi
