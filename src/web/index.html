<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konjac</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; color: #212529; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 1rem; font-weight: 400; line-height: 1.5; text-align: left; -webkit-text-size-adjust: 100%; }
        h1, h2, h3, h4 { margin: 0 0 0.5rem; font-weight: 500; line-height: 1.2; }
        h1 { font-size: calc(1.375rem + 1.5vw); }
        h2 { font-size: calc(1.325rem + 0.9vw); }
        h3 { font-size: calc(1.3rem + 0.6vw); }
        h4 { font-size: calc(1.275rem + 0.3vw); }
        p { margin: 0 0 1rem; }
        #main > .authors { margin-bottom: 0.25rem; }
        #main > .affiliations { margin-bottom: 1.5rem; color: #495057; font-size: 0.9rem; }
        #main > ul { margin: 0.4rem 1.25rem 0.9rem; padding-left: 1.1rem; }
        #main > ul > li + li { margin-top: 0.2rem; }
        small { font-size: 0.875em; }
        a { color: #0d6efd; text-decoration: underline; }
        button { margin: 0; font: inherit; }
        .viewer-container { width: 100%; margin-inline: auto; padding-inline: 0.75rem; }
        .viewer-row { display: flex; flex-wrap: wrap; margin-inline: -0.75rem; }
        .viewer-row > * { flex-shrink: 0; width: 100%; max-width: 100%; padding-inline: 0.75rem; }
        #pdf-drop-zone { display: flex; min-height: 9rem; margin-top: 1rem; padding: 1.5rem; align-items: center; justify-content: center; flex-direction: column; gap: 0.25rem; border: 2px dashed #adb5bd; background: #f8f9fa; color: #495057; text-align: center; cursor: pointer; }
        #pdf-drop-zone:hover, #pdf-drop-zone:focus-visible, #pdf-drop-zone.dragging { border-color: #0d6efd; background: #f0f6ff; outline: none; }
        #pdf-drop-zone:focus-visible { box-shadow: 0 0 0 2px #9ec5fe; }
        .drop-zone-action { color: #0d6efd; font-size: 1.1rem; font-weight: 600; }
        .drop-zone-hint { font-size: 0.9rem; }
        #web-status { display: block; min-height: 1.5em; margin-top: 0.4rem; color: #555; }
        #web-status.error { color: #a00; }
        #pdf-password-dialog { max-width: min(28rem, calc(100% - 2rem)); padding: 1.25rem; border: 1px solid #adb5bd; border-radius: 0.25rem; }
        #pdf-password-dialog::backdrop { background: rgb(0 0 0 / 35%); }
        #pdf-password-dialog form, #pdf-password-dialog label { display: grid; gap: 0.75rem; }
        #pdf-password-dialog input { width: 100%; padding: 0.4rem 0.5rem; font: inherit; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem; }
        .dialog-actions button[value="cancel"] { order: -1; }
        #document-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 1rem; }
        #translation-controls { display: inline-flex; align-items: center; gap: 0.75rem; }
        .document-actions { display: inline-flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-left: auto; }
        .document-menu { position: relative; }
        .document-menu > summary { list-style: none; cursor: pointer; }
        .document-menu > summary::-webkit-details-marker { display: none; }
        .document-menu > summary::after { content: " ▾"; font-size: 0.75em; }
        .document-menu[open] > summary::after { content: " ▴"; }
        .document-menu-items { position: absolute; z-index: 20; top: calc(100% + 0.25rem); right: 0; display: grid; min-width: max-content; padding: 0.35rem; border: 1px solid #ced4da; border-radius: 0.25rem; background: #fff; box-shadow: 0 0.25rem 0.75rem rgb(0 0 0 / 15%); }
        .document-menu-items > .text-button { padding: 0.3rem 0.5rem; text-align: left; }
        .document-menu-items > .text-button:hover, .document-menu-items > .text-button:focus { background: #f0f6ff; text-decoration: none; }
        #translation-file-status { flex-basis: 100%; color: #555; text-align: right; }
        #translation-file-status:empty { display: none; }
        #translation-file-status.error { color: #a00; }
        #document-controls[hidden], #translation-controls[hidden] { display: none; }
        .text-button { padding: 0; border: 0; background: none; color: #0d6efd; font: inherit; }
        .text-button:hover, .text-button:focus { text-decoration: underline; }
        .recent-files { margin-top: 0.75rem; }
        .recent-files summary { width: fit-content; color: #495057; cursor: pointer; }
        .recent-file-list { margin: 0.35rem 0 0; padding-left: 1.4rem; }
        .recent-file-list li { margin: 0.15rem 0; }
        .recent-file-list .text-button { max-width: 100%; overflow-wrap: anywhere; text-align: left; }
        .recent-file-list time { margin-left: 0.6rem; color: #6c757d; font-size: 0.75rem; }
        .paragraph-toggle { margin-left: 0.4rem; font-size: 0.72rem; opacity: 0; }
        .source-linked:hover > .paragraph-toggle, .translatable:hover > .paragraph-toggle, .paragraph-toggle:focus { opacity: 1; }
        .translation-alternative { display: block; margin-top: 0.35rem; }
        .pdf-source-preview { display: block; margin-top: 0.5rem; }
        .pdf-source-preview[hidden] { display: none; }
        .pdf-source-viewport { display: block; height: 18rem; min-height: 8rem; max-height: 80vh; overflow: auto; resize: vertical; border: 2px solid #6ea8fe; background: #e9ecef; box-shadow: inset 0 0 0 1px #fff; cursor: grab; touch-action: none; overscroll-behavior: contain; }
        .pdf-source-viewport:focus-visible { outline: 3px solid #9ec5fe; outline-offset: 2px; }
        .pdf-source-viewport.dragging { cursor: grabbing; user-select: none; }
        .pdf-source-page { position: relative; display: block; }
        .pdf-source-page img { display: block; max-width: none; }
        .pdf-source-highlight { position: absolute; display: block; min-width: 1rem; min-height: 1rem; overflow: hidden; resize: both; border: 1px solid rgb(13 110 253 / 55%); background: rgb(13 110 253 / 2%); cursor: move; }
        .pdf-source-highlight.dragging { cursor: grabbing; }
        .pdf-source-preview small { display: block; margin-top: 0.2rem; color: #6c757d; }
        .pdf-source-preview small > .text-button { margin-left: 0.5rem; font-size: inherit; }
        .pdf-selection-button { position: fixed; z-index: 10; padding: 0.25rem 0.5rem; border: 1px solid #0d6efd; border-radius: 0.2rem; background: #fff; color: #0d6efd; box-shadow: 0 2px 6px rgb(0 0 0 / 20%); font: inherit; font-size: 0.8rem; line-height: 1.3; }
        .pdf-selection-button[hidden] { display: none; }
        .pdf-selection-preview { display: block; margin: 1rem 0; padding: 0.75rem; border: 2px solid #6ea8fe; background: #f8fbff; }
        .pdf-selection-preview > header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
        .pdf-selection-preview > header > span { display: inline-flex; gap: 0.75rem; }
        .pdf-selection-preview > .pdf-source-preview + .pdf-source-preview { margin-top: 1rem; }
        .pdf-inline-source-image { display: inline-block; max-width: 100%; height: auto; vertical-align: middle; }
        .pdf-inline-source-block, .pdf-inline-source-block > .pdf-inline-source-image { display: block; margin: 0.5rem 0; }
        .pdf-inline-figure > .pdf-inline-source-image { margin-right: auto; margin-left: auto; }
        .pdf-inline-restore { margin-left: 0.4rem; font-size: 0.72rem; }
        #progress { width: 100%; height: 2px; margin-top: 1rem; border: 0; border-radius: 0; appearance: none; -webkit-appearance: none; color: #0d6efd; background: #dbeafe; }
        #progress::-webkit-progress-bar { background: #dbeafe; }
        #progress::-webkit-progress-value { background: #0d6efd; }
        #progress::-moz-progress-bar { background: #0d6efd; }
        .licenses { margin: 2rem 0 1rem; color: #6c757d; font-size: 0.75rem; }
        .licenses summary { width: fit-content; color: #495057; cursor: pointer; }
        .licenses h2 { margin-top: 1rem; font-size: 1rem; }
        .license-text { max-height: 18rem; margin: 0; padding: 0.75rem; overflow: auto; background: #f8f9fa; border: 1px solid #dee2e6; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.75rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        @media (hover: none) { .paragraph-toggle { opacity: 0.6; } }
        @media (min-width: 768px) {
            .viewer-container { max-width: 720px; }
            .viewer-side { width: 16.666667%; }
            .viewer-main { width: 66.666667%; }
        }
        @media (min-width: 992px) { .viewer-container { max-width: 960px; } }
        @media (min-width: 1200px) {
            .viewer-container { max-width: 1140px; }
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2rem; }
            h3 { font-size: 1.75rem; }
            h4 { font-size: 1.5rem; }
        }
        @media (min-width: 1400px) { .viewer-container { max-width: 1320px; } }
    </style>
</head>
<body>
    <!-- Web版はローカルPDFを選択して表示する。 -->
    <div class="viewer-container">
        <div class="viewer-row">
            <div class="viewer-side"></div>
            <div class="viewer-main">
                <div id="pdf-source-controls" data-export-exclude>
                    <label id="pdf-drop-zone" for="pdf-file" role="button" tabindex="0">
                        <span class="drop-zone-action">Choose a PDF</span>
                        <span class="drop-zone-hint">or drop it here</span>
                        <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden>
                    </label>
                    <small id="web-status" aria-live="polite"></small>
                    <details id="recent-files" class="recent-files" hidden>
                        <summary>Recent files</summary>
                        <ul id="recent-file-list" class="recent-file-list"></ul>
                    </details>
                </div>
                <dialog id="pdf-password-dialog" data-export-exclude>
                    <form method="dialog">
                        <p id="pdf-password-message"></p>
                        <label>Password <input id="pdf-password" type="password" autocomplete="off"></label>
                        <div class="dialog-actions">
                            <button type="submit" value="submit">Open PDF</button>
                            <button type="submit" value="cancel">Cancel</button>
                        </div>
                    </form>
                </dialog>
                <div id="document-controls" data-export-exclude hidden>
                    <span id="translation-controls" hidden>
                        <button id="translate-document" type="button" class="text-button">Translate to Japanese</button>
                        <button id="toggle-document-originals" type="button" class="text-button" hidden>Show originals</button>
                        <small id="translation-status" aria-live="polite"></small>
                    </span>
                    <span class="document-actions">
                        <details id="document-menu" class="document-menu">
                            <summary class="text-button">Export / Import</summary>
                            <span class="document-menu-items">
                                <button id="export-html" type="button" class="text-button">Export HTML</button>
                                <button id="export-translation-json" type="button" class="text-button">Export translation JSON</button>
                                <button id="import-translation-json" type="button" class="text-button">Import translation JSON</button>
                                <input id="translation-json-file" type="file" accept="application/json,.json" hidden>
                            </span>
                        </details>
                        <small id="translation-file-status" aria-live="polite"></small>
                    </span>
                </div>
                <progress id="progress" data-export-exclude aria-label="Loading PDF" hidden></progress>
                <div id="main"></div>
                <footer class="licenses" data-export-exclude>
                    <details>
                        <summary>Licenses</summary>
                        <h2>Konjac</h2>
                        <pre class="license-text"><%= htmlWebpackPlugin.options.licenses.konjac %></pre>
                        <h2>PDF.js</h2>
                        <pre class="license-text"><%= htmlWebpackPlugin.options.licenses.pdfjs %></pre>
                        <h2>PDF.js CMaps</h2>
                        <pre class="license-text"><%= htmlWebpackPlugin.options.licenses.cmaps %></pre>
                    </details>
                </footer>
            </div>
            <div class="viewer-side"></div>
        </div>
    </div>
</body>
</html>
