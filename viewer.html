<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konjac</title>
    <script type="module" src="dist/viewer.js"></script>
</head>
<body>

    <div class="container-md">
        <div class="row">
            <!-- md サイズ以上の場合に，2:8:2 で div を配置 -->
            <div class="col-md-2"></div>
            <div class="col-md-8">
                <div id="export-controls" hidden style="margin-top: 1rem; text-align: right">
                    <button id="export-html" type="button" class="btn btn-sm btn-outline-primary">Export HTML</button>
                </div>
                <div id="main">
                    <progress id="progress" aria-label="Loading PDF" hidden style="width: 100%; height: 2px; margin-top: 1rem; border: 0; border-radius: 0; accent-color: #0d6efd"></progress>
                </div>
            </div>
            <div class="col-md-2"></div>
        </div>
    </div>

</body>
</html>
